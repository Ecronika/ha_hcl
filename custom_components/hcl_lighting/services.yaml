update_curve:
  name: Update Curve
  description: Update the HCL control points (used by Frontend UI).
  fields:
    entity_id:
      name: Entity
      description: The HCL Switch or Sensor entity.
      required: true
      selector:
        entity:
          integration: hcl_lighting
    points:
      name: Control Points
      description: "List of control points [{t, b, k}] (t 0-1440 min, b 0-100 %, k 2000-7000 K, at least 2). Not used for revert."
      required: false
      selector:
        object:
    mode:
      name: Mode
      description: "Action mode: preview/apply (use points until reload), save (persist points), revert (reload the saved curve)."
      required: true
      selector:
        select:
          options:
            - preview
            - apply
            - save
            - revert
