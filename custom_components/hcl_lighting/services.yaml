update_curve:
  name: Update Curve
  description: Update the HCL control points (used by Frontend UI).
  fields:
    entity_id:
      name: Entity
      description: The HCL Switch or Sensor entity.
      required: true
      selector:
        entity:
          integration: hcl_lighting
    points:
      name: Control Points
      description: "List of control points [{t, b, k}] (t 0-1440 min, b 0-100 %, k 2000-7000 K, at least 2, each time only once). Not used for revert."
      required: false
      selector:
        object:
    mode:
      name: Mode
      description: "Action mode: preview/apply (use points until reload), save (persist points), revert (reload the saved curve)."
      required: true
      selector:
        select:
          options:
            - preview
            - apply
            - save
            - revert

apply:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hcl_lighting
    lights:
      required: false
      selector:
        entity:
          domain: light
          multiple: true
    transition:
      required: false
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    release_manual_control:
      required: false
      default: false
      selector:
        boolean:

set_manual_control:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hcl_lighting
    lights:
      required: false
      selector:
        entity:
          domain: light
          multiple: true
    manual_control:
      required: false
      default: true
      selector:
        boolean:

set_scenario:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hcl_lighting
    scenario:
      required: true
      selector:
        select:
          translation_key: scenario
          options:
            - auto
            - sleep
            - night_light
            - focus
            - relax
            - cleaning
            - guest
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min

get_curve:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: hcl_lighting
