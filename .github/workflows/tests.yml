name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (static checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Fixed version: a new Ruff release must not turn the build red by itself
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.3"

      - name: Run Ruff (rules in ruff.toml)
        run: ruff check --output-format=github .

  hassfest:
    name: hassfest (manifest, translations, services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  homeassistant:
    name: Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum version (hacs.json "homeassistant")
          - ha: "2024.7.0"
            python: "3.12"
            phcc: "0.13.144"
            # HA 2024.7 does not pin josepy; josepy 2.x breaks its acme import
            extra: "josepy<2"
          # Last version with the target helper in helpers.service (ServiceCall
          # with hass since 2025.1). The aiodns of 2025.7/2025.8 needs pycares 4.
          - ha: "2025.7.0"
            python: "3.13"
            phcc: "0.13.260"
            extra: "pycares<5"
          # First version with helpers.target (TargetSelectorData)
          - ha: "2025.8.0"
            python: "3.13"
            phcc: "0.13.269"
            extra: "pycares<5"
          # Current release (update together with pytest-homeassistant-custom-component)
          - ha: "2026.9.3"
            python: "3.14"
            phcc: "0.13.366"
            extra: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Home Assistant test environment
        env:
          PHCC: ${{ matrix.phcc }}
          EXTRA: ${{ matrix.extra }}
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${PHCC}"
          if [ -n "${EXTRA}" ]; then pip install "${EXTRA}"; fi
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: Run tests
        run: pytest tests -p no:cacheprovider

  frontend:
    name: Dashboard card (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio playwright
          python -m playwright install --with-deps chromium

      - name: Run card tests
        env:
          HCL_TEST_CHROMIUM: /nonexistent  # use the Playwright-managed Chromium
          HCL_TEST_REQUIRE_BROWSER: "1"    # fail instead of skipping without a browser
        run: pytest tests_frontend -p no:cacheprovider
